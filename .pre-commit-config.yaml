repos:
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript typecheck
        language: system
        entry: npx tsc --noEmit
        pass_filenames: false
        types: [ts]

      - id: tests
        name: Unit tests
        language: system
        entry: node --import tsx/esm --test
        args: ["src/**/*.test.ts"]
        pass_filenames: false
        types: [ts]

      - id: web-tests
        name: Web component tests
        language: system
        entry: npx vitest run --config web/vite.config.ts
        pass_filenames: false
        types_or: [ts, tsx, css]

      - id: web-build
        name: Web UI build
        language: system
        entry: npx vite build --config web/vite.config.ts
        pass_filenames: false
        types_or: [ts, tsx, css]
