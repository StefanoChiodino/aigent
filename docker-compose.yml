services:
  aigent:
    build: .
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - AIGENT_MODEL
      - AIGENT_THINKING
      - AIGENT_PROVIDER
      - AIGENT_BASE_URL
      - AIGENT_WORKSPACE=/workspace
    volumes:
      - .:/app:ro                    # repo mounted read-only by default
      - /app/node_modules            # container's own node_modules (anonymous volume)
      - ./workspace:/workspace       # persistent workspace (read-write)
      - ./src:/app/src               # source: read-write (agent can self-modify)
      - ./.git:/app/.git             # git: read-write (agent can commit)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    # Drop all capabilities — agent doesn't need any
    cap_drop:
      - ALL
    # No privilege escalation
    security_opt:
      - no-new-privileges:true
    # Resource limits — prevent fork bombs and fd exhaustion
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
      nproc:
        soft: 256
        hard: 256
    # Tmpfs for /tmp (fast, size-limited, not persisted)
    tmpfs:
      - /tmp:size=100M
