services:
  aigent:
    build: .
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY
      - AIGENT_MODEL
      - AIGENT_THINKING
      - AIGENT_WORKSPACE=/workspace
    volumes:
      - .:/app                       # repo mapped in — supervisor handles graceful restart
      - /app/node_modules            # container's own node_modules
      - ./workspace:/workspace       # persistent workspace (memory, personality, etc.)
