services:
  aigent:
    build: .
    # No tty/stdin — the TUI runs on the host (gatekeeper)
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - AIGENT_MODEL
      - AIGENT_THINKING
      - AIGENT_PROVIDER
      - AIGENT_BASE_URL
      - AIGENT_WORKSPACE=/workspace
    volumes:
      - .:/app:ro                    # repo read-only
      - node_modules:/app/node_modules  # persistent named volume (survives --rm)
      - ./workspace:/workspace       # workspace (read-write — TODO: split config ro / memory rw)
      # No writable source or git mounts by default.
      # Self-modification requires explicit grant via /mount.
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    # Drop all capabilities — agent doesn't need any
    cap_drop:
      - ALL
    # No privilege escalation
    security_opt:
      - no-new-privileges:true
    # Resource limits — prevent fork bombs and fd exhaustion
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
      # nproc shared with host (same uid 1000) — set high enough for both.
      # Primary fork bomb protection is the 4GB memory limit.
      nproc:
        soft: 4096
        hard: 4096
    # Tmpfs for /tmp (fast, size-limited, not persisted)
    # The socket directory (/tmp/aigent) is bind-mounted by the gatekeeper
    # at runtime via docker compose run -v — bind mounts overlay tmpfs.
    tmpfs:
      - /tmp:size=100M

volumes:
  node_modules:
