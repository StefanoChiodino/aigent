services:
  aigent:
    build: .
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY
      - AIGENT_MODEL
      - AIGENT_WORKSPACE=/workspace
    volumes:
      - .:/app                       # repo mapped in — agent can modify its own code
      - /app/node_modules            # keep container's own node_modules (don't use host's)
      - ./workspace:/workspace       # persistent workspace (memory, personality, etc.)
