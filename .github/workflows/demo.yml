name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: VITE_DEMO=true VITE_BASE_PATH=/${{ github.event.repository.name }}/ npx vite build --config web/vite.config.ts --mode demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
