<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aigent</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    iframe { width: 100%; height: 100%; border: none; }
    #float-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 9999;
      padding: 5px 10px;
      background: rgba(37, 99, 235, 0.85);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #float-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <iframe id="app" src="http://localhost:3141" allow="microphone; clipboard-write; clipboard-read; display-capture; camera"></iframe>
  <button id="float-btn" title="Open as always-on-top floating panel">Float ↗</button>
  <script src="launcher.js" type="module"></script>
</body>
</html>
