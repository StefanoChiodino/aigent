<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aigent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px 16px;
      width: 220px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.connected { background: #4ade80; }
    .dot.disconnected { background: #f87171; }
    .label {
      color: #aaa;
    }
    .label.connected { color: #4ade80; }
    .label.disconnected { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">aigent</span>
  </div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span class="label" id="label">Checking...</span>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
