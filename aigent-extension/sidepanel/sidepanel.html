<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aigent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    #frame { width: 100%; height: 100%; border: none; }
    #offline {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: #aaa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }
    #offline .icon { font-size: 40px; }
    #offline .title { color: #e0e0e0; font-size: 15px; font-weight: 600; }
    #offline .hint { color: #666; font-size: 12px; line-height: 1.5; }
    #offline button {
      margin-top: 8px;
      padding: 6px 16px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      cursor: pointer;
    }
    #offline button:hover { background: #333; }
  </style>
</head>
<body>
  <iframe id="frame" src="http://localhost:3141" allow="microphone; camera"></iframe>
  <div id="offline">
    <div class="icon">🤖</div>
    <div class="title">aigent is not running</div>
    <div class="hint">Start the gatekeeper with<br><code>make start</code> or <code>npm run dev</code></div>
    <button onclick="retry()">Retry</button>
  </div>
  <script>
    const frame = document.getElementById('frame');
    const offline = document.getElementById('offline');

    frame.onerror = () => showOffline();

    // Detect load failure via a fetch check — iframe doesn't reliably fire onerror
    async function checkOnline() {
      try {
        const res = await fetch('http://localhost:3141/', { method: 'HEAD', signal: AbortSignal.timeout(2000) });
        if (!res.ok) showOffline();
      } catch {
        showOffline();
      }
    }

    function showOffline() {
      frame.style.display = 'none';
      offline.style.display = 'flex';
    }

    function retry() {
      offline.style.display = 'none';
      frame.style.display = '';
      frame.src = 'http://localhost:3141?' + Date.now();
    }

    checkOnline();
  </script>
</body>
</html>
